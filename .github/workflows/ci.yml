name: CI / CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin_name: siftlog
            artifact_name: siftlog-linux-x86_64
          - os: windows-latest
            bin_name: siftlog.exe
            artifact_name: siftlog-windows-x86_64.exe
          - os: macos-latest
            bin_name: siftlog
            artifact_name: siftlog-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build SiftLog
        run: |
          cmake --build build --config Release --parallel

      - name: Run Integration Tests
        run: |
          python tests/verify_mvp.py

      - name: Prepare binary artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ -f "build/${{ matrix.bin_name }}" ]; then
            cp "build/${{ matrix.bin_name }}" "dist/${{ matrix.artifact_name }}"
          elif [ -f "build/Release/${{ matrix.bin_name }}" ]; then
            cp "build/Release/${{ matrix.bin_name }}" "dist/${{ matrix.artifact_name }}"
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*/*
          generate_release_notes: true
