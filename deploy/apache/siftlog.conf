# Apache HTTP Server reverse proxy configuration for SiftLog
# Requires modules: mod_proxy, mod_proxy_http, mod_headers
# Debian/Ubuntu: a2enmod proxy proxy_http headers

<VirtualHost *:80>
    ServerName logs.example.com

    # Allow large log batch ingestion payloads (50 MB)
    LimitRequestBody 52428800

    ProxyPreserveHost On
    ProxyRequests Off

    # Forward client IP and protocol headers
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    # Root proxying
    ProxyPass / http://127.0.0.1:8080/ retry=1 acquire=3000 timeout=60 Keepalive=On
    ProxyPassReverse / http://127.0.0.1:8080/

    # Optional: Subpath proxying (e.g. /logs)
    # ProxyPass /logs/ http://127.0.0.1:8080/ retry=1 acquire=3000 timeout=60 Keepalive=On
    # ProxyPassReverse /logs/ http://127.0.0.1:8080/

    ErrorLog ${APACHE_LOG_DIR}/siftlog_error.log
    CustomLog ${APACHE_LOG_DIR}/siftlog_access.log combined
</VirtualHost>
