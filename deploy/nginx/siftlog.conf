# Nginx reverse proxy configuration for SiftLog
# Place this in /etc/nginx/conf.d/siftlog.conf or include in your nginx.conf

upstream siftlog_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name logs.example.com;

    # Allow large log batch ingestion payloads
    client_max_body_size 50M;

    # Gzip configuration (do not recompress pre-compressed zstd API chunks)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    location / {
        proxy_pass http://siftlog_backend;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts for large searches
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Disable proxy buffering for low-latency live tail
        proxy_buffering off;
    }

    # Optional: Subpath proxying example (e.g. example.com/logs/)
    # location /logs/ {
    #     proxy_pass http://siftlog_backend/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header Connection "";
    #     proxy_buffering off;
    # }
}
